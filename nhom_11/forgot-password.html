<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quên Mật Khẩu - 268 Gaming</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
        font-family: system-ui, sans-serif;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    .forgot-container {
        background: #111;
        padding: 40px;
        border-radius: 16px;
        border: 1px solid #ff2a5f;
        box-shadow: 0 0 30px rgba(255,42,95,0.2);
        width: 100%;
        max-width: 450px;
        margin: 20px;
    }
    .logo { text-align: center; margin-bottom: 20px; }
    .logo img { height: 80px; width: auto; }
    h1 { color: #ff2a5f; text-align: center; font-size: 24px; margin-bottom: 20px; text-transform: uppercase; }
    .desc { text-align: center; color: #aaa; font-size: 14px; margin-bottom: 30px; }
    .input-box {
        display: flex;
        align-items: center;
        background: #000;
        border: 1px solid #333;
        border-radius: 8px;
        margin-bottom: 20px;
        padding: 5px 15px;
    }
    .input-box:focus-within { border-color: #ff2a5f; }
    .input-box i { color: #ff2a5f; font-size: 18px; margin-right: 12px; }
    .input-box input {
        flex: 1;
        background: transparent;
        border: none;
        color: #fff;
        padding: 14px 0;
        font-size: 16px;
        outline: none;
    }
    .btn {
        width: 100%;
        padding: 14px;
        background: #ff2a5f;
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        margin-top: 10px;
    }
    .btn:hover { background: #fff; color: #ff2a5f; }
    .back-link { text-align: center; margin-top: 20px; }
    .back-link a { color: #888; text-decoration: none; font-size: 14px; }
    .back-link a:hover { color: #ff2a5f; }
    .message {
        padding: 12px;
        border-radius: 8px;
        margin-bottom: 20px;
        text-align: center;
        font-size: 14px;
        display: none;
    }
    .message.success { background: rgba(0,255,0,0.1); border: 1px solid #00ff00; color: #00ff00; display: block; }
    .message.error { background: rgba(255,0,0,0.1); border: 1px solid #ff2a5f; color: #ff2a5f; display: block; }
    
    .popup-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.95);
        z-index: 9999;
        justify-content: center;
        align-items: center;
    }
    .popup-card {
        background: #111;
        border: 2px solid #ff2a5f;
        border-radius: 16px;
        padding: 30px;
        text-align: center;
        max-width: 400px;
        width: 90%;
        position: relative;
    }
    .popup-card h3 { color: #ff2a5f; margin-bottom: 15px; font-size: 24px; }
    .code-display {
        background: #000;
        border: 2px solid #ff2a5f;
        border-radius: 12px;
        padding: 20px;
        margin: 20px 0;
    }
    .code-display span { font-size: 36px; font-weight: bold; color: #ff2a5f; letter-spacing: 5px; }
    .popup-card button {
        background: #ff2a5f;
        color: #fff;
        border: none;
        padding: 12px 24px;
        border-radius: 8px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        width: 100%;
    }
    .close-popup {
        position: absolute;
        top: 10px;
        right: 15px;
        font-size: 24px;
        cursor: pointer;
        color: #888;
    }
    .close-popup:hover { color: #ff2a5f; }
</style>
</head>
<body>
<div class="forgot-container">
    <div class="logo">
        <img src="image/download%20(1).jfif" alt="268 Gaming Logo">
    </div>
    <h1>QUÊN MẬT KHẨU</h1>
    <div class="desc">Nhập email đã đăng ký</div>
    
    <div id="message"></div>
    
    <form id="forgotForm">
        <div class="input-box">
            <i class="fa-solid fa-envelope"></i>
            <input type="email" id="email" placeholder="Email đã đăng ký" required>
        </div>
        <button type="submit" class="btn" id="submitBtn">GỬI MÃ XÁC NHẬN</button>
    </form>
    
    <div class="back-link">
        <a href="login.html"><i class="fa-solid fa-arrow-left"></i> Quay lại đăng nhập</a>
    </div>
</div>

<div id="codePopup" class="popup-overlay">
    <div class="popup-card">
        <span class="close-popup" onclick="closePopup()">&times;</span>
        <i class="fa-solid fa-key" style="font-size: 48px; color: #ff2a5f;"></i>
        <h3>MÃ XÁC NHẬN</h3>
        <div class="code-display">
            <span id="displayCode">000000</span>
        </div>
        <p style="color: #aaa;">Sao chép mã để đặt lại mật khẩu</p>
        <button onclick="copyAndContinue()">
            <i class="fa-regular fa-copy"></i> SAO CHÉP & TIẾP TỤC
        </button>
    </div>
</div>

<script>
    let currentCode = '';
    let currentEmail = '';
    
    function closePopup() {
        document.getElementById('codePopup').style.display = 'none';
    }
    
    function showMessage(msg, type) {
        const msgDiv = document.getElementById('message');
        msgDiv.className = 'message ' + type;
        msgDiv.innerHTML = msg;
        setTimeout(() => {
            msgDiv.style.display = 'none';
        }, 5000);
    }
    
    function copyAndContinue() {
        navigator.clipboard.writeText(currentCode).then(() => {
            alert('✅ Đã sao chép mã: ' + currentCode);
        }).catch(() => {
            alert('📋 Mã của bạn: ' + currentCode);
        });
        
        sessionStorage.setItem('reset_email', currentEmail);
        sessionStorage.setItem('reset_code', currentCode);
        window.location.href = 'reset-password.html';
    }
    
    document.getElementById('forgotForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const email = document.getElementById('email').value.trim();
        const submitBtn = document.getElementById('submitBtn');
        
        if (!email) {
            showMessage('❌ Vui lòng nhập email!', 'error');
            return;
        }
        
        submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-pulse"></i> ĐANG XỬ LÝ...';
        submitBtn.disabled = true;
        
        // CÁCH 1: Dùng URLSearchParams (Form Data) - CHẮC CHẮN NHẤT
        const formData = new URLSearchParams();
        formData.append('email', email);
        
        try {
            const response = await fetch('http://localhost/nhom_11/api/api_forgot_password.php', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: formData
            });
            
            const result = await response.json();
            console.log('Kết quả:', result);
            
            if (result.status === 'success') {
                currentCode = result.reset_code;
                currentEmail = result.email;
                document.getElementById('displayCode').innerText = currentCode;
                document.getElementById('codePopup').style.display = 'flex';
                showMessage('✅ Mã của bạn: ' + currentCode, 'success');
            } else {
                showMessage('❌ ' + result.message, 'error');
            }
        } catch (error) {
            console.error('Lỗi:', error);
            showMessage('❌ Lỗi kết nối: ' + error.message, 'error');
        } finally {
            submitBtn.innerHTML = 'GỬI MÃ XÁC NHẬN';
            submitBtn.disabled = false;
        }
    });
</script>
</body>
</html>
