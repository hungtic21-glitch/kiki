<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giỏ Hàng - 268 Gaming</title>
    <link rel="stylesheet" href="assets/css/cart.css">
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo-link">
           <div class="logo logo-image">
               <img src="image/download (1).jfif" alt="268 Gaming Logo" style="height: 100px; width: auto; display: block;">
           </div>
        </a>
        <nav class="desktop-nav">
            <a href="index.html">Trang Chủ</a>
            <a href="products.html">Sản Phẩm</a>
            <a href="cart.html" class="active">Giỏ Hàng</a>
            <a href="contact.html">Phản Hồi</a>
            <a href="login.html">Đăng Nhập</a>
        </nav>
    </header>

    <div class="container">
        <h1>🛒 Giỏ Hàng</h1>
        <div id="cartList"></div>

        <div class="summary">
            <h2>📦 Thông Tin Đơn Hàng</h2>
            <div class="checkout-info">
                <p><span>Số sản phẩm:</span> <strong id="totalItems">0</strong></p>
                <p><span>Tạm tính:</span> <strong id="subtotal">0đ</strong></p>
                <p><span>Phí vận chuyển:</span> <strong style="color: #22c55e;">Miễn phí</strong></p>
                <p class="grand-total"><span>Tổng thanh toán:</span> <strong id="grandTotal" style="color: #ff2a5f; font-size: 1.2rem;">0đ</strong></p>
            </div>
            
            <h3>💳 Phương Thức Thanh Toán</h3>
            <div class="payment-methods">
                <label class="payment-option"><input type="radio" name="payment" value="cod"> COD (Khi nhận hàng)</label>
                <label class="payment-option"><input type="radio" name="payment" value="qr" checked> Quét QR Banking</label>
            </div>
            <button class="checkout-btn" id="checkoutBtn">XÁC NHẬN THANH TOÁN</button>
        </div>
    </div>

    <div id="qrModal" class="qr-modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 9999; justify-content: center; align-items: center;">
        <div class="qr-modal-card" style="background: #1a1a1a; padding: 30px; border-radius: 20px; border: 1px solid #ff2a5f; text-align: center; max-width: 400px; position: relative;">
            <button class="close-qr-btn" id="closeQrBtn" style="position: absolute; top: 15px; right: 20px; background: none; border: none; color: #fff; font-size: 1.5rem; cursor: pointer;">&times;</button>
            <h2 style="color: #fff; margin-bottom: 5px;">QUÉT MÃ THANH TOÁN</h2>
            <div style="background: #fff; padding: 15px; border-radius: 10px; display: inline-block; margin-bottom: 20px;">
                <img id="vietQrImg" src="" alt="Mã QR" style="width: 220px; height: 220px; object-fit: contain;">
            </div>
            <div style="background: #252525; padding: 15px; border-radius: 8px; text-align: left; margin-bottom: 20px;">
                <p style="color: #ccc;">Nội dung: <strong id="qrDesc" style="color: #fff;"></strong></p>
                <p style="color: #ccc;">Số tiền: <strong id="qrAmount" style="color: #00f2fe;">0đ</strong></p>
            </div>
            <button id="btnDonePay" style="width: 100%; padding: 12px; background: #ff2a5f; color: #fff; border: none; font-weight: bold; cursor: pointer; border-radius: 8px;">TÔI ĐÃ THANH TOÁN XONG</button>
        </div>
    </div>

    <script>
        let cart = [];
        function formatPrice(p){ return p.toLocaleString("vi-VN") + "₫"; }

        function renderCart(){
            const cartList = document.getElementById("cartList");
            let totalQty = 0, totalPrice = 0;
            cartList.innerHTML = "";

            if(cart.length === 0){
                cartList.innerHTML = `<div class="empty" style="text-align:center; padding: 40px; color: #aaa;">Giỏ hàng trống</div>`;
                document.getElementById("totalItems").innerText = "0";
                document.getElementById("subtotal").innerText = "0₫";
                document.getElementById("grandTotal").innerText = "0₫";
                return;
            }

            cart.forEach(item => {
                totalQty += parseInt(item.quantity);
                totalPrice += parseInt(item.quantity) * parseInt(item.price);

                cartList.innerHTML += `
                <div class="cart-item" style="display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid #333; padding:15px 0;">
                    <img src="${item.image}" style="width:70px; height:70px; object-fit:contain; background:#fff; border-radius:8px;">
                    <div style="flex:2; padding:0 15px;"><h3>${item.name}</h3><p>${formatPrice(parseInt(item.price))}</p></div>
                    <div><span>SL: ${item.quantity}</span></div>
                    <div style="color:#00f2fe; font-weight:bold; margin-left:20px;">${formatPrice(item.quantity * item.price)}</div>
                </div>`;
            });

            document.getElementById("totalItems").innerText = totalQty;
            document.getElementById("subtotal").innerText = formatPrice(totalPrice);
            document.getElementById("grandTotal").innerText = formatPrice(totalPrice);
        }

        // Đã sửa đường dẫn kết nối chuẩn xác API Backend dự án nhom_11
        async function loadCartFromDB() {
            try {
                const response = await fetch('http://localhost/nhom_11/api/api_get_cart.php'); 
                const result = await response.json();
                if (result.status === 'success') {
                    cart = result.data; 
                    renderCart();       
                }
            } catch (error) {
                console.error("Lỗi kết nối API lấy giỏ hàng", error);
            }
        }
        loadCartFromDB();
    </script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const checkoutBtn = document.getElementById('checkoutBtn');
            const qrModal = document.getElementById('qrModal');
            const closeQrBtn = document.getElementById('closeQrBtn');
            const btnDonePay = document.getElementById('btnDonePay');
            const vietQrImg = document.getElementById('vietQrImg');

            // Hàm POST đẩy dữ liệu giỏ hàng lưu vào Database
            async function postOrderToBackend(method) {
                try {
                    const response = await fetch('http://localhost/nhom_11/api/api_checkout.php', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            customer_name: "NGUYỄN VĂN A",
                            phone: "0987654321",
                            address: "Thanh toán trực tiếp Web",
                            payment_method: method,
                            cart: cart
                        })
                    });
                    const res = await response.json();
                    return res.status === "success";
                } catch (e) {
                    return false;
                }
            }

            checkoutBtn.addEventListener('click', async () => {
                const totalText = document.getElementById('grandTotal').innerText;
                const amount = parseInt(totalText.replace(/[^0-9]/g, ''));

                if (!amount || amount === 0) {
                    alert('Giỏ hàng trống!'); return;
                }

                const paymentMethod = document.querySelector('input[name="payment"]:checked').value;
                
                if (paymentMethod === 'cod') {
                    const saved = await postOrderToBackend("COD");
                    if(saved) {
                        alert('🎉 Đơn hàng COD đã được lưu thành công vào lịch sử Database!');
                        window.location.reload();
                    } else { alert('Lỗi đồng bộ dữ liệu MySQL'); }
                    return;
                }

                const orderId = "DH" + Math.floor(100000 + Math.random() * 900000);
                const desc = `THANH TOAN ${orderId}`;
                vietQrImg.src = `https://img.vietqr.io/image/MB-123456789999-compact2.jpg?amount=${amount}&addInfo=${encodeURIComponent(desc)}&accountName=NGUYEN%20VAN%20A`;
                
                document.getElementById('qrAmount').innerText = totalText;
                document.getElementById('qrDesc').innerText = desc;
                qrModal.style.display = 'flex';
            });

            closeQrBtn.addEventListener('click', () => qrModal.style.display = 'none');

            btnDonePay.addEventListener('click', async () => {
                btnDonePay.innerText = "ĐANG XỬ LÝ...";
                const saved = await postOrderToBackend("Banking");
                if (saved) {
                    alert('⚡ Hệ thống đã nạp và lưu đơn hàng Banking vào Database thành công!');
                    qrModal.style.display = 'none';
                    window.location.href = "index.html";
                } else {
                    alert('Lỗi lưu lịch sử đơn hàng!');
                }
            });
        });
    </script>
</body>
</html>
