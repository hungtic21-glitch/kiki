<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đặt Lại Mật Khẩu - 268 Gaming</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    body {
        background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
        font-family: system-ui, sans-serif;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    .reset-container {
        background: #111;
        padding: 40px;
        border-radius: 16px;
        border: 1px solid #ff2a5f;
        box-shadow: 0 0 30px rgba(255,42,95,0.2);
        width: 100%;
        max-width: 450px;
        margin: 20px;
    }
    .logo {
        text-align: center;
        margin-bottom: 20px;
    }
    .logo img {
        height: 80px;
        width: auto;
    }
    h1 {
        color: #ff2a5f;
        text-align: center;
        font-size: 24px;
        margin-bottom: 20px;
        text-transform: uppercase;
    }
    .desc {
        text-align: center;
        color: #aaa;
        font-size: 14px;
        margin-bottom: 30px;
    }
    .input-box {
        display: flex;
        align-items: center;
        background: #000;
        border: 1px solid #333;
        border-radius: 8px;
        margin-bottom: 20px;
        padding: 5px 15px;
        transition: 0.3s;
    }
    .input-box:focus-within {
        border-color: #ff2a5f;
        box-shadow: 0 0 8px rgba(255,42,95,0.3);
    }
    .input-box i {
        color: #ff2a5f;
        font-size: 18px;
        margin-right: 12px;
    }
    .input-box input {
        flex: 1;
        background: transparent;
        border: none;
        color: #fff;
        padding: 14px 0;
        font-size: 16px;
        outline: none;
    }
    .input-box input::placeholder {
        color: #666;
    }
    .btn {
        width: 100%;
        padding: 14px;
        background: #ff2a5f;
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: bold;
        text-transform: uppercase;
        cursor: pointer;
        transition: 0.3s;
        margin-top: 10px;
    }
    .btn:hover {
        background: #fff;
        color: #ff2a5f;
        box-shadow: 0 0 15px rgba(255,42,95,0.5);
    }
    .back-link {
        text-align: center;
        margin-top: 20px;
    }
    .back-link a {
        color: #888;
        text-decoration: none;
        font-size: 14px;
    }
    .back-link a:hover {
        color: #ff2a5f;
    }
    .message {
        padding: 12px;
        border-radius: 8px;
        margin-bottom: 20px;
        text-align: center;
        font-size: 14px;
        display: none;
    }
    .message.success {
        background: rgba(0,255,0,0.1);
        border: 1px solid #00ff00;
        color: #00ff00;
        display: block;
    }
    .message.error {
        background: rgba(255,0,0,0.1);
        border: 1px solid #ff2a5f;
        color: #ff2a5f;
        display: block;
    }
    .email-display {
        background: #1a1a1a;
        padding: 10px;
        border-radius: 8px;
        margin-bottom: 20px;
        text-align: center;
        color: #ff2a5f;
        font-size: 14px;
    }
    .auto-fill-btn {
        background: #1a1a1a;
        border: 1px solid #333;
        color: #ff2a5f;
        padding: 8px;
        border-radius: 6px;
        cursor: pointer;
        margin-top: 5px;
        font-size: 12px;
    }
    .auto-fill-btn:hover {
        background: #ff2a5f;
        color: #fff;
    }
</style>
</head>
<body>
<div class="reset-container">
    <div class="logo">
        <img src="image/download%20(1).jfif" alt="268 Gaming Logo">
    </div>
    <h1>ĐẶT LẠI MẬT KHẨU</h1>
    
    <div id="emailDisplay" class="email-display"></div>
    
    <div id="message" class="message"></div>
    
    <form id="resetForm">
        <div class="input-box">
            <i class="fa-solid fa-key"></i>
            <input type="text" id="resetCode" placeholder="Nhập mã xác nhận" required>
        </div>
        <button type="button" class="auto-fill-btn" onclick="autoFillCode()">
            <i class="fa-solid fa-paste"></i> DÁN MÃ TỰ ĐỘNG
        </button>
        <div class="input-box" style="margin-top: 15px;">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="newPassword" placeholder="Mật khẩu mới (ít nhất 6 ký tự)" required>
        </div>
        <div class="input-box">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="confirmPassword" placeholder="Xác nhận mật khẩu mới" required>
        </div>
        <button type="submit" class="btn">ĐẶT LẠI MẬT KHẨU</button>
    </form>
    
    <div class="back-link">
        <a href="login.html"><i class="fa-solid fa-arrow-left"></i> Quay lại đăng nhập</a>
    </div>
</div>

<script>
    // Kiểm tra xem có email từ trang forgot không
    const resetEmail = sessionStorage.getItem('reset_email');
    const savedCode = sessionStorage.getItem('reset_code');
    
    if (!resetEmail) {
        window.location.href = 'forgot-password.html';
    }
    
    document.getElementById('emailDisplay').innerHTML = `<i class="fa-solid fa-envelope"></i> Đang đặt lại mật khẩu cho: <strong>${resetEmail}</strong>`;
    
    // Tự động điền mã nếu có
    function autoFillCode() {
        if (savedCode) {
            document.getElementById('resetCode').value = savedCode;
            document.getElementById('resetCode').style.borderColor = '#00ff00';
            setTimeout(() => {
                document.getElementById('resetCode').style.borderColor = '#333';
            }, 2000);
        } else {
            alert('❌ Không tìm thấy mã! Vui lòng quay lại trang quên mật khẩu.');
        }
    }
    
    // Tự động điền khi load trang
    if (savedCode) {
        setTimeout(() => {
            autoFillCode();
        }, 500);
    }
    
    document.getElementById('resetForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const resetCode = document.getElementById('resetCode').value.trim();
        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        const messageDiv = document.getElementById('message');
        
        if (!resetCode) {
            messageDiv.className = 'message error';
            messageDiv.innerHTML = '❌ Vui lòng nhập mã xác nhận!';
            return;
        }
        
        if (newPassword.length < 6) {
            messageDiv.className = 'message error';
            messageDiv.innerHTML = '❌ Mật khẩu phải có ít nhất 6 ký tự!';
            return;
        }
        
        if (newPassword !== confirmPassword) {
            messageDiv.className = 'message error';
            messageDiv.innerHTML = '❌ Mật khẩu xác nhận không khớp!';
            return;
        }
        
        messageDiv.className = '';
        messageDiv.style.display = 'none';
        
        // Hiển thị loading
        const submitBtn = document.querySelector('.btn');
        const originalText = submitBtn.innerHTML;
        submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-pulse"></i> ĐANG XỬ LÝ...';
        submitBtn.disabled = true;
        
        try {
            const response = await fetch('http://localhost/nhom_11/api/api_reset_password.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    email: resetEmail,
                    reset_code: resetCode,
                    new_password: newPassword
                })
            });
            
            const result = await response.json();
            
            if (result.status === 'success') {
                messageDiv.className = 'message success';
                messageDiv.innerHTML = '✅ Đặt lại mật khẩu thành công! Chuyển hướng đến trang đăng nhập...';
                
                // Xóa session storage
                sessionStorage.removeItem('reset_email');
                sessionStorage.removeItem('reset_code');
                
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
            } else {
                messageDiv.className = 'message error';
                messageDiv.innerHTML = '❌ ' + result.message;
            }
        } catch (error) {
            console.error(error);
            messageDiv.className = 'message error';
            messageDiv.innerHTML = '❌ Không thể kết nối đến máy chủ! Vui lòng kiểm tra XAMPP!';
        } finally {
            submitBtn.innerHTML = originalText;
            submitBtn.disabled = false;
        }
    });
</script>
</body>
</html>
