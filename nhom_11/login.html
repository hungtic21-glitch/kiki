<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng Nhập</title>
<link rel="stylesheet" href="assets/css/styles.css">
<link rel="stylesheet" href="assets/css/login.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <header class="navbar">

        <div class="logo-area">
            <a href="index.html">
                <img src="image/download (1).jfif" alt="268 Gaming">
            </a>
        </div>
    
        <nav class="desktop-nav">
            <a href="index.html">TRANG CHỦ</a>
            <a href="products.html">SẢN PHẨM</a>
            <a href="cart.html">GIỎ HÀNG</a>
            <a href="contact.html">PHẢN HỒI</a>
            <a href="login.html" class="active">ĐĂNG NHẬP</a>
        </nav>
    
    </header>
<div class="login-container">

<div class="login-box">

<div class="logo">
<img src="image/download (1).jfif">
</div>

<h1>ĐĂNG NHẬP</h1>

<form id="loginForm">

<div class="input-box">
<i class="fa-solid fa-envelope"></i>
<input type="email" id="email" placeholder="Nhập Email" required>
</div>

<div class="input-box">
<i class="fa-solid fa-lock"></i>
<input type="password" id="password" placeholder="Nhập Mật Khẩu" required>
</div>

<div class="options">
<label><input type="checkbox"> Ghi nhớ đăng nhập</label>
<a href="#">Quên mật khẩu?</a>
</div>

<button type="submit" class="btn">ĐĂNG NHẬP</button>

<div class="register-link">
<p>Chưa có tài khoản? <a href="register.html">Đăng ký ngay</a></p>
</div>

</form>
</div>
</div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const loginForm = document.getElementById("loginForm");

            if (loginForm) {
                loginForm.addEventListener("submit", async function (e) {
                    e.preventDefault(); // Chặn hành vi load lại trang mặc định của HTML Form

                    // Lấy giá trị đầu vào từ form đăng nhập
                    const emailValue = document.getElementById("email").value.trim();
                    const passwordValue = document.getElementById("password").value.trim();

                    if (!emailValue || !passwordValue) {
                        alert("Vui lòng điền đầy đủ Email và Mật khẩu!");
                        return;
                    }

                    // Đóng gói dữ liệu chuẩn bị gửi đi dạng JSON
                    const loginData = {
                        email: emailValue,
                        password: passwordValue
                    };

                    try {
                        // Gọi API xử lý đăng nhập, truyền dữ liệu bằng phương thức POST
                        const response = await fetch('http://localhost/nhom_11/api/api_login.php', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify(loginData)
                        });

                        const result = await response.json();

                        if (result.status === "success") {
                            alert("🎉 " + result.message);
                            // Nếu đăng nhập thành công, tự động chuyển hướng người dùng về Trang Chủ
                            window.location.href = "index.html"; 
                        } else {
                            // Nếu đăng nhập thất bại (sai pass hoặc email), hiển thị thông báo cảnh báo lỗi
                            alert("❌ " + result.message);
                        }
                    } catch (error) {
                        console.error("Lỗi đồng bộ API Login:", error);
                        alert("Không thể kết nối đến hệ thống máy chủ backend. Vui lòng kiểm tra lại Apache/MySQL!");
                    }
                });
            }
        });
    </script>
</body>
</html>
