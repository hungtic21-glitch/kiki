<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng Ký</title>
<link rel="stylesheet" href="assets/css/login.css">
<link rel="stylesheet" href="assets/css/styles.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
<div class="login-container">
<div class="login-box register">
<div class="logo">
<img src="image/download (1).jfif">
</div>

<h1>ĐĂNG KÝ</h1>

<form id="registerForm">

<div class="input-box">
<i class="fa-solid fa-user"></i>
<input type="text" id="fullName" placeholder="Họ Và Tên" required>
</div>

<div class="input-box">
<i class="fa-solid fa-envelope"></i>
<input type="email" id="email" placeholder="Email" required>
</div>

<div class="input-box">
<i class="fa-solid fa-lock"></i>
<input type="password" id="password" placeholder="Mật khẩu" required>
</div>

<div class="input-box">
<i class="fa-solid fa-lock"></i>
<input type="password" id="confirmPassword" placeholder="Nhập lại mật khẩu" required>
</div>

<button type="submit" class="btn">ĐĂNG KÝ</button>

<div class="register-link">
<p>Đã có tài khoản? <a href="login.html">Đăng nhập</a></p>
</div>

</form>
</div>
</div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const registerForm = document.getElementById("registerForm");

            if (registerForm) {
                registerForm.addEventListener("submit", async function (e) {
                    e.preventDefault(); // Ngăn chặn tải lại trang mặc định

                    // Lấy toàn bộ giá trị từ các ô nhập liệu
                    const fullName = document.getElementById("fullName").value.trim();
                    const email = document.getElementById("email").value.trim();
                    const password = document.getElementById("password").value;
                    const confirmPassword = document.getElementById("confirmPassword").value;

                    // Kiểm tra xem mật khẩu nhập lại có khớp không trước khi gửi lên Server
                    if (password !== confirmPassword) {
                        alert("❌ Mật khẩu nhập lại không trùng khớp! Vui lòng kiểm tra lại.");
                        return;
                    }

                    // Đóng gói dữ liệu dạng JSON gửi đi
                    const registerData = {
                        full_name: fullName,
                        email: email,
                        password: password
                    };

                    try {
                        // Gọi sang API Đăng ký nằm trong thư mục api/
                        const response = await fetch('http://localhost/nhom_11/api/api_register.php', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify(registerData)
                        });

                        const result = await response.json();

                        if (result.status === "success") {
                            alert("🎉 Đăng ký tài khoản thành công!");
                            // Chuyển hướng ngay sang trang đăng nhập để người dùng test luôn
                            window.location.href = "login.html";
                        } else {
                            // Hiển thị lỗi từ backend trả về (Ví dụ: Trùng Email)
                            alert("❌ Lỗi: " + result.message);
                        }
                    } catch (error) {
                        console.error("Lỗi đồng bộ API Register:", error);
                        alert("Không thể kết nối đến máy chủ backend. Vui lòng kiểm tra XAMPP!");
                    }
                });
            }
        });
    </script>
</body>
</html>
