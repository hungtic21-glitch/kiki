<!DOCTYPE html>
<html lang="vi">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Đăng Ký</title>
<link rel="stylesheet" href="assets/css/login.css">
<link rel="stylesheet" href="assets/css/styles.css">
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
<div class="login-container">
<div class="login-box register">
<div class="logo">
<img src="image/download (1).jfif">
</div>

<h1>ĐĂNG KÝ</h1>

<form>

<div class="input-box">
<i class="fa-solid fa-user"></i>
<input type="text"
placeholder="Họ Và Tên">
</div>

<div class="input-box">
<i class="fa-solid fa-envelope"></i>
<input type="email"
placeholder="Email">
</div>

<div class="input-box">
<i class="fa-solid fa-lock"></i>
<input type="password"
placeholder="Mật khẩu">
</div>

<div class="input-box">
<i class="fa-solid fa-lock"></i>
<input type="password"
placeholder="Xác nhận mật khẩu">
</div>

<label class="agree">

<input type="checkbox">

Tôi đồng ý điều khoản sử dụng

</label>

<button type="submit">
Tạo Tài Khoản
</button>

<div class="register-link">

Đã có tài khoản?

<a href="login.html">
Đăng nhập
</a>

</div>

</form>

</div>

</div>

</body>
</html>
