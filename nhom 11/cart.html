<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giỏ Hàng - 268 Gaming</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    
    <style>
        /* Toàn bộ giao diện tối theo phong cách Gaming */
        :root {
            --bg-color: #0b0c10;
            --panel-color: #1f2833;
            --main-red: #ff2a5f;
            --text-light: #c5c6c7;
            --text-white: #ffffff;
            --cyan-accent: #66fcf1;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-light);
            padding-bottom: 50px;
        }

        /* Header / Navbar */
        header {
            background-color: #151a22;
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--main-red);
            box-shadow: 0 4px 15px rgba(255, 42, 95, 0.1);
        }

        .logo img {
            height: 50px;
            border-radius: 8px;
        }

        nav a {
            color: var(--text-white);
            text-decoration: none;
            margin-left: 25px;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 14px;
            transition: 0.3s;
        }

        nav a:hover, nav a.active {
            color: var(--main-red);
            text-shadow: 0 0 10px rgba(255, 42, 95, 0.5);
        }

        /* Container chính */
        .cart-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .cart-title {
            font-size: 32px;
            color: var(--text-white);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 30px;
            text-align: center;
            position: relative;
        }

        .cart-title::after {
            content: '';
            display: block;
            width: 60px;
            height: 4px;
            background: var(--main-red);
            margin: 10px auto 0;
            border-radius: 2px;
            box-shadow: 0 0 8px var(--main-red);
        }

        /* Bảng giỏ hàng hiện đại */
        .cart-table {
            width: 100%;
            border-collapse: collapse;
            background-color: var(--panel-color);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }

        .cart-table th {
            background-color: #2c3540;
            color: var(--main-red);
            text-transform: uppercase;
            font-size: 14px;
            letter-spacing: 1px;
            padding: 18px;
            text-align: center;
        }

        .cart-table td {
            padding: 20px;
            border-bottom: 1px solid #2c3540;
            text-align: center;
            vertical-align: middle;
            color: var(--text-white);
        }

        .cart-table tr:last-child td {
            border-bottom: none;
        }

        /* Hình ảnh sản phẩm */
        .product-img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #3a4756;
        }

        .product-name {
            font-weight: 600;
            text-align: left !important;
            padding-left: 10px;
        }

        .product-price {
            color: var(--cyan-accent);
            font-weight: bold;
        }

        /* Bộ nút tăng giảm số lượng cực ngầu */
        .quantity-control {
            display: inline-flex;
            align-items: center;
            background: #151a22;
            border: 1px solid #3a4756;
            border-radius: 6px;
            overflow: hidden;
        }

        .quantity-btn {
            background: transparent;
            border: none;
            color: var(--text-white);
            width: 35px;
            height: 35px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
        }

        .quantity-btn:hover {
            background-color: var(--main-red);
            color: white;
        }

        .quantity-input {
            width: 45px;
            text-align: center;
            background: transparent;
            border: none;
            color: var(--text-white);
            font-weight: bold;
            font-size: 15px;
            outline: none;
        }

        /* Nút xóa (Thùng rác) */
        .delete-btn {
            background: transparent;
            border: none;
            color: #ff4d4d;
            cursor: pointer;
            font-size: 18px;
            transition: 0.2s;
        }

        .delete-btn:hover {
            color: #ff1a1a;
            transform: scale(1.2);
        }

        /* Khu vực tổng tiền & Thanh toán */
        .cart-summary {
            margin-top: 30px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 30px;
        }

        .total-price-box {
            font-size: 20px;
            color: var(--text-white);
        }

        .total-price-box span {
            color: var(--cyan-accent);
            font-size: 26px;
            font-weight: 800;
            text-shadow: 0 0 10px rgba(102, 252, 241, 0.3);
        }

        .checkout-btn {
            background: linear-gradient(45deg, var(--main-red), #bc0837);
            color: white;
            border: none;
            padding: 14px 35px;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 42, 95, 0.4);
            transition: 0.3s;
        }

        .checkout-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 42, 95, 0.6);
        }
    </style>
</head>
<body>

      <header>
        <a href="index.html" class="logo-link">
            <div class="logo logo-image">
                <img src="image/download (1).jfif"alt="268 Gaming Logo" 
                     style="height: 100px; width: auto; display: block;">
            </div>
        </a>
        
        <nav class="desktop-nav">
            <a href="index.html">Trang Chủ</a>
            <a href="products.html">Sản Phẩm</a>
            <a href="cart.html">Giỏ Hàng</a>
            <a href="contact.html">Phản Hồi</a>
            <a href="login.html">Đăng Nhập</a>
        </nav>
    
        <div class="menu-toggle" id="menu-toggle-btn">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </header>

    <div class="cart-container">
        <h1 class="cart-title">Giỏ Hàng</h1>

        <table class="cart-table">
            <thead>
                <tr>
                    <th style="width: 15%;">Ảnh</th>
                    <th style="width: 35%;">Tên sản phẩm</th>
                    <th style="width: 15%;">Giá</th>
                    <th style="width: 15%;">Số lượng</th>
                    <th style="width: 15%;">Tổng</th>
                    <th style="width: 5%;">Xóa</th>
                </tr>
            </thead>
            <tbody id="cart-items">
                <tr>
                    <td><img src="https://via.placeholder.com/80" alt="Sản phẩm" class="product-img"></td>
                    <td class="product-name">Bàn phím cơ Gaming Asus ROG Strix</td>
                    <td class="product-price">2.500.000đ</td>
                    <td>
                        <div class="quantity-control">
                            <button class="quantity-btn"><i class="fas fa-minus"></i></button>
                            <input type="text" class="quantity-input" value="1" readonly>
                            <button class="quantity-btn"><i class="fas fa-plus"></i></button>
                        </div>
                    </td>
                    <td class="product-price">2.500.000đ</td>
                    <td><button class="delete-btn"><i class="fas fa-trash-alt"></i></button></td>
                </tr>
            </tbody>
        </table>

        <div class="cart-summary">
            <div class="total-price-box">
                Tổng tiền: <span id="total-amount">2.500.000đ</span>
            </div>
            <button class="checkout-btn">Thanh Toán Ngay</button>
        </div>
    </div>

<script src="assets/js/cart.js"></script>
</body>
</html>
