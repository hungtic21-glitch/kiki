<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký Tài Khoản - 268 Gaming</title>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="auth-page">

    <header>
        <a href="index.html" class="logo-link">
            <div class="logo logo-image">
                <img src="image/download (1).jfif"alt="268 Gaming Logo" 
                     style="height: 60px; width: auto; display: block;">
            </div>
        </a>
        
        <nav class="desktop-nav">
            <a href="index.html">Trang Chủ</a>
            <a href="products.html">Sản Phẩm</a>
            <a href="cart.html">Giỏ Hàng</a>
            <a href="contact.html">Phản Hồi</a>
            <a href="login.html">Đăng Nhập</a>
        </nav>
    
        <div class="menu-toggle" id="menu-toggle-btn">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </header>

    <main class="auth-container">
        <div class="cyber-box register-box">
            <div class="cyber-corner top-left"></div>
            <div class="cyber-corner top-right"></div>
            <div class="cyber-corner bottom-left"></div>
            <div class="cyber-corner bottom-right"></div>

            <div class="auth-header">
                <h2><span>//</span> TẠO TÀI KHOẢN</h2>
                <div class="audio-wave">
                    <span></span><span></span><span></span><span></span><span></span>
                </div>
            </div>

            <form action="#" class="cyber-form">
                <div class="input-group">
                    <label for="fullname">Họ và Tên</label>
                    <div class="input-wrapper">
                        <input type="text" id="fullname" placeholder="Nhập đầy đủ họ tên" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="email">Địa chỉ Email</label>
                    <div class="input-wrapper">
                       
                        <input type="email" id="email" placeholder="Nhập địa chỉ email" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="password">Mật khẩu</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" placeholder="Tạo mật khẩu bảo mật" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="confirm-password">Xác nhận mật khẩu</label>
                    <div class="input-wrapper">
                        <input type="password" id="confirm-password" placeholder="Nhập lại mật khẩu" required>
                    </div>
                </div>

                <div class="form-options terms-option">
                    <label class="remember-me">
                        <input type="checkbox" required> 
                        <span>Tôi đồng ý với <a href="#" class="cyber-link">Điều khoản dịch vụ</a></span>
                    </label>
                </div>
                <button type="submit" class="btn-cyber">
                    <span class="btn-text">TẠO TÀI KHOẢN</span>
                </button>

                <p class="auth-redirect">
                    Đã có tài khoản? <a href="login.html">Đăng nhập</a>
                </p>
            </form>
        </div>
    </main>

    <div class="sidebar-menu" id="sidebar-navigation">
        <div class="sidebar-logo">268 <span>Gaming</span></div>
        <nav class="sidebar-nav">
            <a href="index.html"> Trang Chủ</a>
            <a href="products.html">📦Sản Phẩm</a>
            <a href="cart.html"> Giỏ Hàng</a>
            <a href="contact.html"> Liên Hệ</a>
        </nav>
    </div>
    <div class="menu-overlay" id="menu-overlay-bg"></div>

    <script src="assets/js/main.js"></script>
</body>
</html>
