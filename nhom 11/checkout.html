<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh Toán Đơn Hàng - 268 Gaming</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <style>
        .checkout-wrapper {
            display: flex;
            gap: 40px;
        }
        .checkout-form {
            flex: 2;
            background-color: var(--bg-card);
            padding: 25px;
            border-radius: 8px;
            border: 1px solid #222;
        }
        .order-summary {
            flex: 1;
            background-color: #111;
            padding: 25px;
            border-radius: 8px;
            border: 1px solid var(--primary-neon);
            height: fit-content;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            background-color: #0a0a0a;
            border: 1px solid #333;
            color: #fff;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .form-group input:focus {
            border-color: var(--primary-neon);
            outline: none;
        }
        .summary-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #222;
        }
    </style>
</head>
<body>

    <header>
         <a href="index.html" class="logo-link">
            <div class="logo logo-image">
                <img src="d:\4f480882-31ec-42e0-9b60-973a13a69537.png  "alt="268 Gaming Logo" 
                     style="height: 60px; width: auto; display: block;">
            </div>
        </a>
        <nav>
            <a href="index.html">Trang Chủ</a>
            <a href="products.html">Sản Phẩm</a>
            <a href="cart.html" class="active">Giỏ Hàng</a>
            <a href="contact.html">Liên Hệ</a>
        </nav>
    </header>

    <div class="container">
        <div class="section-title">Thông Tin Thanh Toán</div>
        
        <div class="checkout-wrapper">
            <div class="checkout-form">
                <h3 style="margin-top:0; margin-bottom:20px; color:var(--primary-neon);">Thông tin giao hàng</h3>
                <form action="#">
                    <div class="form-group">
                        <label>Họ và Tên người nhận *</label>
                        <input type="text" placeholder="Nhập đầy đủ họ và tên" required>
                    </div>
                    <div class="form-group">
                        <label>Số điện thoại *</label>
                        <input type="tel" placeholder="Nhập số điện thoại nhận hàng" required>
                    </div>
                    <div class="form-group">
                        <label>Địa chỉ nhận hàng chi tiết *</label>
                        <input type="text" placeholder="Số nhà, tên đường, phường/xã, quận/huyện" required>
                    </div>
                    <div class="form-group">
                        <label>Phương thức thanh toán</label>
                        <select>
                            <option>Thanh toán khi nhận hàng (COD)</option>
                            <option>Chuyển khoản ngân hàng (Qua mã QR)</option>
                        </select>
                    </div>
                </form>
            </div>

            <div class="order-summary">
                <h3 style="margin-top:0; margin-bottom:20px;">Đơn hàng của bạn</h3>
                <div class="summary-item">
                    <span>1x Razer DeathAdder V3</span>
                    <span>1.890.000 đ</span>
                </div>
                <div class="summary-item">
                    <span>Phí vận chuyển</span>
                    <span style="color: var(--secondary-cyber);">Miễn phí</span>
                </div>
                <div class="summary-item" style="border:none; font-size:18px; font-weight:bold;">
                    <span>Tổng tiền:</span>
                    <span style="color: var(--primary-neon);">1.890.000 đ</span>
                </div>
                <button class="btn-main" style="width: 100%; margin-top: 10px;">Xác Nhận Đặt Hàng</button>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 - Nhóm 11 - Lớp WE24-01. All rights reserved.</p>
    </footer>

</body>
</html>
